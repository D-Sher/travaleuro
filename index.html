<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 觀海 × 湖光山色｜義大利海岸 × 蔚藍海岸 15 天慢旅行｜10/14–10/28</title>
<meta name="description" content="2026 科莫湖、米蘭、義大利利古里亞海岸與法國蔚藍海岸 15 天慢旅行｜Taipei → Dubai → Como → Milano → Genova → Ventimiglia → Nice → Taipei">
<style>
:root{
  --ink:#18252d; --muted:#6b777d; --paper:#f6f3ed; --paper2:#ece8df;
  --white:#fff; --line:#ded8cc; --accent:#c5795b; --accent2:#58716e;
  --navy:#263b45; --gold:#c3a56c; --shadow:0 18px 50px rgba(32,45,49,.10);
  --radius:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--ink);background:var(--paper);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",
  "Microsoft JhengHei",sans-serif;line-height:1.78;
}
a{color:inherit;text-decoration:none}
img{max-width:100%}
.wrap{width:min(1180px,92%);margin:auto}
.hero{
  min-height:760px;color:#fff;display:flex;align-items:flex-end;
  background:
    linear-gradient(115deg,rgba(18,31,38,.82),rgba(26,53,60,.42)),
    url("https://www.michelangelo.travel/fileadmin/_processed_/e/4/csm_04_LagoDiComo_Bellaggio_AdobeStock_355740181_eedafe2f8a.jpeg") center/cover;
  position:relative;overflow:hidden;
}
.hero:after{
  content:"";position:absolute;inset:auto -10% -120px -10%;height:220px;
  background:var(--paper);transform:rotate(-3deg);
}
.hero-inner{position:relative;z-index:1;width:min(1180px,92%);margin:0 auto;padding:100px 0 120px}
.eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;opacity:.82}
.hero h1{font-size:clamp(44px,7vw,86px);line-height:1.02;max-width:900px;margin:18px 0 24px;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:#f0d8b0}
.hero p{font-size:20px;max-width:820px;margin:0 0 30px;color:rgba(255,255,255,.92)}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{
  border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.16);
  padding:7px 14px;border-radius:999px;font-size:13px;backdrop-filter:blur(8px)
}
.nav{
  position:sticky;top:0;z-index:50;background:rgba(246,243,237,.90);
  backdrop-filter:blur(16px);border-bottom:1px solid rgba(222,216,204,.92)
}
.nav-inner{display:flex;align-items:center;gap:8px;overflow:auto;white-space:nowrap}
.nav a{padding:15px 13px;font-size:13px;color:var(--muted)}
.nav a:hover{color:var(--accent)}
.section{padding:86px 0}
.section.tinted{background:var(--paper2)}
.kicker{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.section h2{font-size:clamp(30px,4vw,48px);line-height:1.18;margin:8px 0 14px;letter-spacing:-.02em}
.lead{color:var(--muted);font-size:17px;max-width:820px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:34px}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 7px 26px rgba(34,45,49,.045)}
.stat b{display:block;font-size:29px;color:var(--navy);line-height:1.1;margin-bottom:7px}
.stat span{font-size:13px;color:var(--muted)}
.route-shell{
  margin-top:34px;background:#fff;border:1px solid var(--line);border-radius:26px;
  padding:28px;box-shadow:var(--shadow);overflow:hidden;
}
.route-line{display:flex;align-items:flex-start;min-width:1100px;padding:32px 12px 22px}
.rnode{width:11.11%;text-align:center;position:relative}
.rnode:last-child{width:5%}
.rdot{
  width:15px;height:15px;border-radius:50%;margin:0 auto 12px;background:var(--accent);
  box-shadow:0 0 0 7px #f0e2da
}
.rnode:not(:last-child):after{
  content:"";position:absolute;top:7px;left:50%;width:100%;height:1px;background:#cfc6b8;z-index:0
}
.rdot,.rnode strong,.rnode small{position:relative;z-index:1}
.rnode strong{display:block;font-size:14px}
.rnode small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.route-note{margin-top:12px;color:var(--muted);font-size:13px}
.editorial{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px;margin-top:34px}
.photo{
  min-height:330px;position:relative;border-radius:22px;overflow:hidden;color:#fff;background:#2b3940;
}
.photo img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85;position:absolute;inset:0}
.photo:after{content:"";position:absolute;inset:30% 0 0;background:linear-gradient(transparent,rgba(10,19,24,.82))}
.photo-copy{position:absolute;z-index:2;left:24px;right:24px;bottom:22px}
.photo-copy .small{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.78}
.photo-copy h3{margin:5px 0 4px;font-size:25px}
.photo-copy p{margin:0;font-size:13px;opacity:.92}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:30px 0 10px}
.filter{
  border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:999px;
  font:inherit;font-size:12px;color:var(--muted);cursor:pointer
}
.filter.active,.filter:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.days{margin-top:10px}
.day{
  display:grid;grid-template-columns:92px 1fr 220px;gap:25px;padding:38px 0;
  border-top:1px solid var(--line)
}
.day-no{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em}
.day h3{margin:0;font-size:26px;line-height:1.3}
.meta{font-size:13px;color:var(--muted);margin-top:4px}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}
.badge{font-size:11px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 9px;color:var(--muted)}
.day ul{margin:8px 0;padding-left:19px}
.day li{margin:4px 0}
aside.focus{
  align-self:start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;
}
.focus .label{font-size:11px;color:var(--accent);font-weight:800;letter-spacing:.14em}
.focus h4{margin:5px 0 5px;font-size:15px}
.focus p{margin:0;color:var(--muted);font-size:13px}
.stay-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:30px}
.stay{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;
  min-height:170px;position:relative;overflow:hidden
}
.stay .num{font-size:11px;color:var(--accent);letter-spacing:.12em}
.stay h3{margin:6px 0 2px;font-size:20px}
.stay p{margin:0;color:var(--muted);font-size:13px}
.stay .nights{position:absolute;right:16px;top:16px;font-size:12px;color:var(--gold);font-weight:800}
.principles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:30px}
.principle{border-top:2px solid var(--navy);padding-top:16px}
.principle b{font-size:25px;color:var(--navy)}
.principle h4{margin:7px 0 5px;font-size:16px}
.principle p{margin:0;color:var(--muted);font-size:13px}
.return{
  border-radius:28px;padding:46px;color:#fff;
  background:linear-gradient(135deg,#29434d,#60746f);
  box-shadow:var(--shadow)
}
.return .kicker{color:#f0d5a6}
.return h2{margin:7px 0 10px;color:#fff}
.route-flight{display:flex;flex-wrap:wrap;gap:18px;align-items:center;font-size:27px}
.route-flight span{opacity:.55}
.smallnote{font-size:12px;opacity:.78;margin-top:12px}
footer{padding:55px 0 75px;color:var(--muted);font-size:12px}
footer .line{height:1px;background:var(--line);margin-bottom:18px}
@media(max-width:1000px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .editorial{grid-template-columns:1fr 1fr}
  .day{grid-template-columns:74px 1fr}
  .day aside{grid-column:2}
  .stay-grid{grid-template-columns:repeat(3,1fr)}
  .principles{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:650px){
  .hero{min-height:690px}
  .hero-inner{padding-bottom:95px}
  .hero p{font-size:17px}
  .section{padding:64px 0}
  .stats{grid-template-columns:1fr 1fr}
  .editorial{grid-template-columns:1fr}
  .photo{min-height:280px}
  .day{grid-template-columns:1fr;gap:8px}
  .day aside{grid-column:auto}
  .stay-grid,.principles{grid-template-columns:1fr}
  .route-shell{overflow:auto}
  .route-line{min-width:1000px}
}
</style>
</head>

<body>
<header class="hero" id="top">
  <div class="hero-inner">
    <div class="eyebrow">PRIVATE SLOW JOURNEY · 觀海 × 湖光山色</div>
    <h1>2026 <em>義大利海岸 × 蔚藍海岸</em><br>15 天慢旅行</h1>
    <p>
      Dubai → Como → Milano → Genova → Ventimiglia → Nice → Dubai → Taipei
      <br>
      精選 5 大停留基地，14 晚落地住宿，專注於地中海的藍與科莫湖的幽。
    </p>
    <div class="chips">
      <span class="chip">2026.10.14 — 10.28</span>
      <span class="chip">15 DAYS / 14 NIGHTS</span>
      <span class="chip">
